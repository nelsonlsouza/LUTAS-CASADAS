<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>Tatame Fight Manager</title>
  </head>
  <body>
    <div id="root"><p style="color:#aaa;font-family:Arial;padding:32px">Carregando Tatame...</p></div>
    <script>
      function showStartupError(title, message) {
        document.getElementById('root').innerHTML = '<div style="color:#fff;background:#32151a;padding:24px;font-family:Arial"><h2>' + title + '</h2><pre style="white-space:pre-wrap">' + String(message) + '</pre></div>';
      }
      window.addEventListener('error', function (event) { showStartupError('Erro ao iniciar a aplicação', event.message); });
      window.addEventListener('unhandledrejection', function (event) { showStartupError('Erro ao carregar dados', event.reason && event.reason.message ? event.reason.message : event.reason); });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
